# Villa Alizéa — configuration Netlify
[build]
  # Le dossier publié est assemblé par outils-publier.sh : Netlify déploie
  # tout ce qu'on lui donne, et src/orig pèse quatre cents mégaoctets.
  command  = "bash outils-publier.sh"
  publish  = "_site"
  functions = "netlify/functions"

[build.processing]
  skip_processing = true

# Le site appelle /api/disponibilites et /api/acompte. Les fonctions Netlify ne
# répondent qu'à /.netlify/functions/<nom> : sans cette redirection, le
# calendrier reste vide et l'acompte échoue une fois en ligne, alors que tout
# fonctionne en local où le serveur de développement fait la correspondance.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
