<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Essai des replis du hero</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/style.css?v=efebcb40">
<style>body{padding:0}#journal{position:fixed;inset:auto 0 0;background:#111;color:#0f0;
font:12px ui-monospace,monospace;padding:8px;z-index:999;max-height:40vh;overflow:auto}</style>
<script>
document.documentElement.className += " anime";
// --- simulation des conditions, AVANT le chargement de hero.js -------------
var CAS = new URLSearchParams(location.search).get("cas") || "normal";
var vraiMM = window.matchMedia.bind(window);
window.matchMedia = function (q) {
  if (CAS === "sobre" && /prefers-reduced-motion/.test(q))
    return { matches: true, addEventListener: function(){}, media: q };
  return vraiMM(q);
};
if (CAS === "lent")   Object.defineProperty(navigator, "connection", { value: { effectiveType: "3g" }, configurable: true });
if (CAS === "donnees")Object.defineProperty(navigator, "connection", { value: { saveData: true },      configurable: true });
if (CAS === "force") {          // neutralise l'estimation de debit du navigateur
  Object.defineProperty(navigator, "connection", { value: { effectiveType: "4g" }, configurable: true });
}
if (CAS === "latence") {         // la 1re image lente, les suivantes normales
  /* Le cas exact de la regression : a froid, la premiere requete paie la
     resolution du nom, la poignee de main TLS et le premier acces a l'objet
     sur le CDN. Le debit se deduisait d'elle seule, et le hero se figeait.
     Attendu desormais : anime, la connexion etant chaude des la deuxieme. */
  var imgFroide = window.Image, premiere = true;
  window.Image = function () {
    var e = new imgFroide(), pose = null, tarde = premiere; premiere = false;
    Object.defineProperty(e, "onload", {
      configurable: true,
      get: function () { return pose; },
      set: function (f) {
        pose = f;
        e.addEventListener("load", function () {
          if (tarde) setTimeout(function () { f.call(e); }, 600);
          else f.call(e);
        });
      }
    });
    return e;
  };
}
if (CAS === "debit") {           // chaque image met 400 ms : liaison etranglee
  /* Ce cas manquait, et c'est celui qui a laisse passer le defaut : le repli
     « debit-insuffisant » se declenchait a chaque premiere visite sans que
     rien ici ne le montre. On retarde l'arrivee de chaque image pour obtenir
     un debit reellement insuffisant, au lieu de l'annoncer au navigateur. */
  var imgLente = window.Image;
  window.Image = function () {
    var e = new imgLente(), pose = null;
    Object.defineProperty(e, "onload", {
      configurable: true,
      get: function () { return pose; },
      set: function (f) {
        pose = f;
        e.addEventListener("load", function () {
          setTimeout(function () { f.call(e); }, 400);
        });
      }
    });
    return e;
  };
}
if (CAS === "panne") {           // toutes les images du hero echouent
  var vraieImage = window.Image;
  window.Image = function () {
    var e = new vraieImage();
    /* On neutralise aussi onload. Sans cela, une image deja en cache pouvait
       reussir avant l'echec simule : une promesse ne se resout qu'une fois,
       et le cas devenait aleatoire — il passait ou non selon l'etat du cache. */
    Object.defineProperty(e, "onload", {
      configurable: true, get: function () { return null; }, set: function () {}
    });
    setTimeout(function () { e.onerror && e.onerror(); }, 5);
    return e;
  };
}
</script></head><body>
<section class="hero" id="hero">
  <div class="hero__course" id="course"><div class="hero__cadre">
    <div class="hero__pile" id="pile"></div>
    <img class="hero__affiche" id="hero-affiche" src="/assets/hero/affiche-l.webp?v=aeb15057" alt="repli">
    <div class="hero__voile" id="hero-voile"></div>
    <div class="hero__sortie" id="hero-sortie"></div>
    <div class="hero__texte" id="hero-texte"><div class="page"><h1>Villa Alizéa</h1></div></div>
    <div class="hero__pilote"><span>Défilez</span><span class="hero__piste"><i class="hero__curseur" id="curseur"></i></span></div>
    <div class="hero__jauge" id="jauge"></div>
  </div></div>
</section>
<div style="height:150vh"></div>
<pre id="journal"></pre>
<!-- Sans hero-data.js, window.ALIZEA_HERO est absent : hero.js sort sur
     « sequence-absente » avant d'atteindre quoi que ce soit d'autre, et
     ce banc validait « sequence-absente » pour tous les cas sauf les deux
     verifies en amont. Il ne verifiait donc plus rien. -->
<script src="/js/hero-data.js?v=1911d3dd"></script>
<script src="/js/hero.js?v=6978c2bd"></script>
<script>
setTimeout(function () {
  var h = document.getElementById("hero"), c = document.getElementById("course");
  var repli = getComputedStyle(document.querySelector(".hero__affiche")).display;
  var toile = document.querySelector(".hero__toile");
  var reseau = performance.getEntriesByType("resource")
      .filter(function (e) { return /\/assets\/hero\/[lp]\d{3}\.avif/.test(e.name); }).length;
  document.getElementById("journal").textContent = JSON.stringify({
    cas: CAS,
    classeHero: h.className,
    raisonRepli: h.getAttribute("data-repli"),
    imageDeRepliVisible: repli !== "none",
    toilePresente: !!toile,
    hauteurCourse: Math.round(c.getBoundingClientRect().height),
    hauteurEcran: window.innerHeight,
    imagesTelechargees: reseau
  }, null, 1);
}, 2500);
</script></body></html>
